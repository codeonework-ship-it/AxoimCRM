# Axiom CRM — local stack (skeleton). `docker compose up -d --build`
# Postgres (RLS-enforced shared schema, ADR-001) + Kafka (outbox relay target,
# ADR-003) + the modular-monolith API (ADR-006).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: axiom
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - axiom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axiom"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Runtime traffic: least-privilege axiom_app, subject to RLS (ADR-001).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/axiom
      SPRING_DATASOURCE_USERNAME: axiom_app
      SPRING_DATASOURCE_PASSWORD: axiom_app_dev_password
      # Migrations run as postgres superuser (owns schema, defines policies).
      FLYWAY_URL: jdbc:postgresql://postgres:5432/axiom
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      # Outbox relay: dedicated role that may read/update outbox_event across
      # tenants and nothing else (V3__outbox_relay_role.sql).
      AXIOM_RELAY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/axiom
      AXIOM_RELAY_DATASOURCE_USERNAME: axiom_relay
      AXIOM_RELAY_DATASOURCE_PASSWORD: axiom_relay_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AXIOM_CORS_ORIGINS: http://localhost:5173,http://localhost:4280
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4280:80"
    restart: unless-stopped


volumes:
  axiom-pgdata:
