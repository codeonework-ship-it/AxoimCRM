# Axiom CRM — local stack.
#
# The DATABASE IS NOT IN DOCKER. PostgreSQL 17 runs on the host and owns the
# four environment databases (AxiomCrmdb_Dev/QA/UAT/Prod), so data persists
# independently of any container lifecycle and `docker compose down` can never
# destroy it. Containers reach it via host.docker.internal.
#
# This also resolves a real conflict: the old postgres service published 5432,
# the same port the host PostgreSQL already binds.
#
# Runs here: Kafka (outbox relay target, ADR-003) + the modular-monolith API
# (ADR-006) + the web client.

services:
  kafka:
    image: ${AXIOM_KAFKA_IMAGE:-apache/kafka:3.7.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${AXIOM_KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${AXIOM_KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # Runtime traffic: least-privilege axiom_app, subject to RLS (ADR-001).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      AXIOM_ENVIRONMENT: ${AXIOM_ENVIRONMENT:-dev}
      AXIOM_DB_NAME: ${AXIOM_DB_NAME:-AxiomCrmdb_Dev}
      AXIOM_DB_USER: ${AXIOM_DB_USER:-Axiom}
      AXIOM_DB_PASSWORD: ${AXIOM_DB_PASSWORD:-Axiom@12345}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${AXIOM_DB_HOST:-host.docker.internal}:${AXIOM_DB_PORT:-5432}/${AXIOM_DB_NAME:-AxiomCrmdb_Dev}
      SPRING_DATASOURCE_USERNAME: axiom_app
      SPRING_DATASOURCE_PASSWORD: axiom_app_dev_password
      # Migrations run as postgres superuser (owns schema, defines policies).
      FLYWAY_URL: jdbc:postgresql://${AXIOM_DB_HOST:-host.docker.internal}:${AXIOM_DB_PORT:-5432}/${AXIOM_DB_NAME:-AxiomCrmdb_Dev}
      FLYWAY_USER: ${AXIOM_DB_USER:-Axiom}
      FLYWAY_PASSWORD: ${AXIOM_DB_PASSWORD:-Axiom@12345}
      # Outbox relay: dedicated role that may read/update outbox_event across
      # tenants and nothing else (V3__outbox_relay_role.sql).
      AXIOM_RELAY_DATASOURCE_URL: jdbc:postgresql://${AXIOM_DB_HOST:-host.docker.internal}:${AXIOM_DB_PORT:-5432}/${AXIOM_DB_NAME:-AxiomCrmdb_Dev}
      AXIOM_RELAY_DATASOURCE_USERNAME: axiom_relay
      AXIOM_RELAY_DATASOURCE_PASSWORD: axiom_relay_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AXIOM_CORS_ORIGINS: ${AXIOM_CORS_ORIGINS:-http://localhost:5173,http://localhost:4280}
      # Dedicated machine credential. Non-dev profiles refuse the committed
      # development default, so QA/UAT/Prod must inject this from a secret store.
      AXIOM_PROMETHEUS_SCRAPE_TOKEN: ${AXIOM_PROMETHEUS_SCRAPE_TOKEN:-axiom-prometheus-dev-token-change-before-use}
    ports:
      - "${AXIOM_API_PORT:-8080}:8080"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${AXIOM_WEB_PORT:-4280}:80"
    restart: unless-stopped

  alertmanager:
    image: ${AXIOM_ALERTMANAGER_IMAGE:-prom/alertmanager:v0.32.1}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      # Localhost-only by default. Production exposure belongs behind the
      # platform reverse proxy and its operator identity provider.
      - "127.0.0.1:${AXIOM_ALERTMANAGER_PORT:-9096}:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: ${AXIOM_PROMETHEUS_IMAGE:-prom/prometheus:v3.12.0}
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      umask 077
      printf '%s' "$${AXIOM_PROMETHEUS_SCRAPE_TOKEN}" > /tmp/axiom-api-scrape-token
      exec /bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/prometheus \
        --storage.tsdb.retention.time=$${AXIOM_PROMETHEUS_RETENTION:-15d} \
        --web.enable-lifecycle
    environment:
      AXIOM_PROMETHEUS_SCRAPE_TOKEN: ${AXIOM_PROMETHEUS_SCRAPE_TOKEN:-axiom-prometheus-dev-token-change-before-use}
      AXIOM_PROMETHEUS_RETENTION: ${AXIOM_PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${AXIOM_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
