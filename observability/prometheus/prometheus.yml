global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: axiom-api
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /tmp/axiom-api-scrape-token
    static_configs:
      - targets: [api:8080]
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          component: monitoring

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels:
          component: alerting
