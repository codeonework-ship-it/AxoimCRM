# Axiom CRM — qa profile.
# Values come from .env.qa at the repository root; the defaults below keep a
# bare `mvn spring-boot:run` working on a developer machine.
spring:
  config:
    activate:
      on-profile: qa
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${AXIOM_DB_HOST:localhost}:${AXIOM_DB_PORT:5432}/${AXIOM_DB_NAME:AxiomCrmdb_QA}}
    username: ${SPRING_DATASOURCE_USERNAME:axiom_app}
    password: ${SPRING_DATASOURCE_PASSWORD:axiom_app_dev_password}
  flyway:
    url: ${FLYWAY_URL:jdbc:postgresql://${AXIOM_DB_HOST:localhost}:${AXIOM_DB_PORT:5432}/${AXIOM_DB_NAME:AxiomCrmdb_QA}}
    user: ${FLYWAY_USER:${AXIOM_DB_USER:Axiom}}
    password: ${FLYWAY_PASSWORD:${AXIOM_DB_PASSWORD:Axiom@12345}}

axiom:
  environment:
    name: qa
  relay:
    datasource:
      url: ${AXIOM_RELAY_DATASOURCE_URL:jdbc:postgresql://${AXIOM_DB_HOST:localhost}:${AXIOM_DB_PORT:5432}/${AXIOM_DB_NAME:AxiomCrmdb_QA}}
