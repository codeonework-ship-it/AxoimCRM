spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${AXIOM_DB_HOST:localhost}:${AXIOM_DB_PORT:5435}/${AXIOM_DB_NAME:AxiomCRMDB_Prod}}
    hikari:
      maximum-pool-size: ${AXIOM_DB_POOL_SIZE:30}
  jpa:
    properties:
      hibernate:
        format_sql: false

axiom:
  environment:
    name: prod
  jwt:
    ttl-minutes: ${AXIOM_JWT_TTL_MINUTES:60}
